# deploy/correa-munoz.conf — host virtual del examen en servidor2 (Apache)
# Nombre: primeros apellidos de la pareja en orden alfabético (Correa, Muñoz).
# Requiere el registro "correa-munoz IN A 172.16.1.59" en la zona m3examen.com de servidor1
# y los módulos proxy y proxy_http (sudo a2enmod proxy proxy_http).
# Instalar: sudo cp deploy/correa-munoz.conf /etc/apache2/sites-available/
#           sudo a2ensite correa-munoz.conf && sudo apache2ctl configtest && sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName correa-munoz.m3examen.com

    # Frontend (se entrega en el examen): copiarlo en esta carpeta
    DocumentRoot /var/www/correa-munoz
    DirectoryIndex index.html login.html

    <Directory /var/www/correa-munoz>
        Require all granted
    </Directory>

    # API Gateway: /api/<recurso> se reenvía al microservicio en 127.0.0.1
    ProxyPass        /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPassReverse /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPass        /api/reservas http://127.0.0.1:3011/reservas
    ProxyPassReverse /api/reservas http://127.0.0.1:3011/reservas

    # Proveedor (se entrega en el examen): completar recurso y puerto
    # ProxyPass        /api/<recurso> http://127.0.0.1:<puerto>/<recurso>
    # ProxyPassReverse /api/<recurso> http://127.0.0.1:<puerto>/<recurso>

    ErrorLog ${APACHE_LOG_DIR}/correa-munoz_error.log
    CustomLog ${APACHE_LOG_DIR}/correa-munoz_access.log combined
</VirtualHost>
