<VirtualHost *:80>
    ServerName correa-munoz-f13.m3examen.com

    DocumentRoot /var/www/correa-munoz-f13
    DirectoryIndex index.html

    <Directory /var/www/correa-munoz-f13>
        Require all granted
    </Directory>

    ProxyPass         /api/usuarios      http://127.0.0.1:3001/usuarios
    ProxyPassReverse  /api/usuarios      http://127.0.0.1:3001/usuarios
    ProxyPass         /api/reservas      http://127.0.0.1:3011/reservas
    ProxyPassReverse  /api/reservas      http://127.0.0.1:3011/reservas
    ProxyPass         /api/habitaciones  http://127.0.0.1:3012/habitaciones
    ProxyPassReverse  /api/habitaciones  http://127.0.0.1:3012/habitaciones

    ErrorLog ${APACHE_LOG_DIR}/examen_error.log
    CustomLog ${APACHE_LOG_DIR}/examen_access.log combined
</VirtualHost>